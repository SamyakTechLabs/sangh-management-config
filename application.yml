server:
  port: 8081
  tomcat:
    max-swallow-size: 65MB  # Max size for the entire request body at the Tomcat server level

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:sangh-one-be}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
  servlet:
    multipart:
      enabled: true
      max-file-size: 65MB  # Max size of a single file
      max-request-size: 65MB  # Max size of the entire request
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    type: org.apache.commons.dbcp2.BasicDataSource
    dbcp2:
      initial-size: 5
      max-total: 10
      max-idle: 5
      min-idle: 2
      validation-query: SELECT 1
      test-on-borrow: true
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: ${MANAGEMENT_ENDPOINT_METRICS_ENABLED}
    tags:
      datasource: ${MANAGEMENT_ENDPOINT_TAGS_DATASOURCE}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}
    operationsSorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER}
    tagsSorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER}

openapi:
  servers:
    - url: "http://localhost:8081"
      description: "LOCAL ENV"

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access:
    expiration:
      time: ${JWT_ACCESS_EXPIRATION_TIME}
  refresh:
    expiration:
      time: ${JWT_REFRESH_EXPIRATION_TIME}

amazon:
  aws:
    s3:
      access-key: ${AMAZON_AWS_S3_ACCESS_KEY}
      secret-key: ${AMAZON_AWS_S3_SECRET_KEY}
      region: ${AMAZON_AWS_S3_REGION}
      bucket: ${AMAZON_AWS_S3_BUCKET}
    ses:
      region: ${AMAZON_AWS_SES_REGION}
      access-key: ${AMAZON_AWS_SES_ACCESS_KEY}
      secret-key: ${AMAZON_AWS_SES_SECRET_KEY}
